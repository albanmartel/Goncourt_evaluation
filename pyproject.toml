[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "goncourt-evaluation"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "bandit>=1.9.4",
    "cffi>=2.1.1",
    "cryptografy>=3.0.0",
    "dotenv>=0.9.9",
    "flake8>=7.3.0",
    "mkdocs>=1.6.1",
    "mkdocstrings>=1.0.6",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pydocstyle>=6.3.0",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.3",
    "radon>=6.0.1",
    "sphinx>=9.1.0",
    "types-pymysql>=1.2.0.20260807",
]

[tool.hatch.build.targets.wheel]
packages = ["goncourt"]