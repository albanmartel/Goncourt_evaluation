repos:
  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry: flake8
        language: system
        types: [python]
        args: ["--max-line-length=88", "--ignore=E203,W503"]

      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        args: ["--ignore-missing-imports"]

      - id: pydocstyle
        name: pydocstyle
        entry: pydocstyle
        language: system
        types: [python]
        args: ["--match-dir=^(?!tests|docs|\\.venv).*"]

      - id: bandit
        name: bandit (sécurité - sévérité moyenne+)
        entry: bandit
        language: system
        types: [python]
        # -ll : Medium/High severity, -ii : Medium/High confidence
        args: ["-r", "src/", "-ll", "-ii", "-x", "tests/"]

      - id: radon
        name: radon (complexité cyclomatique >= C)
        entry: radon cc
        language: system
        types: [python]
        # -n C : alerte uniquement à partir de la note C (complexité modérée/élevée)
        args: ["src/", "-n", "C", "-a"]
